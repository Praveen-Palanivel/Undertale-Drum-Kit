<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>UnderTale SoundTrack</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1 class="title"><img src="./images/undertale_soundtrack_cropped.png" alt="UnderTale"></h1>
        
        <div>
            <img src="./images/Toriel_overworld_guiding.gif" alt="Toriel_overworld_guiding" class="image" data-key="special">
        </div>

        <img src="./images/prees_the_keys.png" alt="press the keys" class="press"></img>
        
        <div class="label">
            <span>M</span>
            <span>U</span>
            <span>S</span>
            <span>P</span>
            <span>T</span>
            <span>G</span>
            <span>F</span>
        </div>

        <div class="set">
            <button class="m UnderTale" data-key="m"></button>
            <button class="u UnderTale" data-key="u"></button>
            <button class="s UnderTale" data-key="s"></button>
            <button class="p UnderTale" data-key="p"></button>
            <button class="t UnderTale" data-key="t"></button>
            <button class="g UnderTale" data-key="g"></button>
            <button class="f UnderTale" data-key="f"></button>
        </div>
        
        <div id="stop">
            <button class="stop">Stop</button>
        </div>

        <footer>
            <img src="./images/stay_determined[1].png" alt="stay_determined" class="foot" data-key="determined">
        </footer>

        <script src="index.js" charset="utf-8"></script>
    </body>

</html>
